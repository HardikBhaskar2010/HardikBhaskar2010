<svg width="900" height="6" viewBox="0 0 900 6" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Core green scanline gradient — bright center, transparent edges -->
    <linearGradient id="scanCore" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#00FF41" stop-opacity="0"/>
      <stop offset="8%"   stop-color="#00FF41" stop-opacity="0.6"/>
      <stop offset="50%"  stop-color="#00FF41" stop-opacity="1"/>
      <stop offset="92%"  stop-color="#00FF41" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00FF41" stop-opacity="0"/>
    </linearGradient>

    <!-- Wider soft glow underneath -->
    <linearGradient id="scanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#00FF41" stop-opacity="0"/>
      <stop offset="15%"  stop-color="#00FF41" stop-opacity="0.15"/>
      <stop offset="50%"  stop-color="#39FF14" stop-opacity="0.3"/>
      <stop offset="85%"  stop-color="#00FF41" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00FF41" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Soft wide glow band -->
  <rect x="0" y="0" width="900" height="6" fill="url(#scanGlow)" rx="3">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
  </rect>

  <!-- Sharp bright core line -->
  <rect x="0" y="2" width="900" height="2" fill="url(#scanCore)" rx="1">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="1.5s" repeatCount="indefinite"/>
  </rect>
</svg>
