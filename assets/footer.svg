<svg width="900" height="80" viewBox="0 0 900 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="fclip">
      <rect width="900" height="80" rx="10"/>
    </clipPath>
  </defs>

  <g clip-path="url(#fclip)">
    <!-- background -->
    <rect width="900" height="80" fill="#0B1020"/>

    <!-- outer frame -->
    <rect x="3" y="3" width="894" height="74" rx="8" fill="none" stroke="#E84545" stroke-width="2"/>
    <!-- inner frame -->
    <rect x="8" y="8" width="884" height="64" rx="5" fill="none" stroke="#E84545" stroke-opacity="0.25" stroke-width="1"/>

    <!-- decorative pixel diamonds — left side -->
    <g transform="translate(30,30)" fill="#FCD34D" opacity="0.7">
      <rect x="4" y="0" width="4" height="4"/><rect x="0" y="4" width="4" height="4"/>
      <rect x="8" y="4" width="4" height="4"/><rect x="4" y="8" width="4" height="4"/>
    </g>
    <g transform="translate(60,34)" fill="#E84545" opacity="0.5">
      <rect x="2" y="0" width="3" height="3"/><rect x="0" y="3" width="3" height="3"/>
      <rect x="4" y="3" width="3" height="3"/><rect x="2" y="6" width="3" height="3"/>
    </g>

    <!-- motto — serif, elegant contrast to header -->
    <text x="450" y="38" text-anchor="middle"
          font-family="'Georgia','Palatino Linotype','Times New Roman',serif"
          font-size="14" font-style="italic" fill="#9CA3AF" letter-spacing="1">
      build it clean · build it bold · build it alive
    </text>

    <!-- label — monospace small -->
    <text x="450" y="58" text-anchor="middle"
          font-family="'Courier New','Lucida Console',monospace"
          font-size="10" fill="#4B5563" letter-spacing="3">
      HARDIK BHASKAR · 2025
    </text>

    <!-- decorative pixel diamonds — right side -->
    <g transform="translate(840,34)" fill="#E84545" opacity="0.5">
      <rect x="2" y="0" width="3" height="3"/><rect x="0" y="3" width="3" height="3"/>
      <rect x="4" y="3" width="3" height="3"/><rect x="2" y="6" width="3" height="3"/>
    </g>
    <g transform="translate(858,30)" fill="#FCD34D" opacity="0.7">
      <rect x="4" y="0" width="4" height="4"/><rect x="0" y="4" width="4" height="4"/>
      <rect x="8" y="4" width="4" height="4"/><rect x="4" y="8" width="4" height="4"/>
    </g>
  </g>
</svg>
