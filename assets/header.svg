<svg width="900" height="230" viewBox="0 0 900 230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="55%" stop-color="#12102A"/>
      <stop offset="100%" stop-color="#160E2E"/>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0"/>
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="rounded">
      <rect x="0" y="0" width="900" height="230" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <rect width="900" height="230" fill="url(#bgGrad)"/>

    <!-- ambient glow drifting -->
    <circle cx="140" cy="60" r="160" fill="url(#glow)">
      <animate attributeName="cx" values="140;760;140" dur="18s" repeatCount="indefinite"/>
    </circle>

    <!-- faint grid -->
    <g stroke="#A78BFA" stroke-opacity="0.06">
      <line x1="0" y1="40" x2="900" y2="40"/>
      <line x1="0" y1="80" x2="900" y2="80"/>
      <line x1="0" y1="120" x2="900" y2="120"/>
      <line x1="0" y1="160" x2="900" y2="160"/>
      <line x1="0" y1="200" x2="900" y2="200"/>
      <line x1="150" y1="0" x2="150" y2="230"/>
      <line x1="300" y1="0" x2="300" y2="230"/>
      <line x1="450" y1="0" x2="450" y2="230"/>
      <line x1="600" y1="0" x2="600" y2="230"/>
      <line x1="750" y1="0" x2="750" y2="230"/>
    </g>

    <!-- floating particles -->
    <circle r="2.4" fill="#06B6D4">
      <animateMotion path="M60,190 C 220,130 300,60 480,90 S 780,150 840,50" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle r="1.8" fill="#A78BFA">
      <animateMotion path="M840,40 C 700,110 560,150 380,120 S 120,60 60,170" dur="16s" repeatCount="indefinite" begin="-3s"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="16s" repeatCount="indefinite" begin="-3s"/>
    </circle>
    <circle r="2" fill="#E5E7EB">
      <animateMotion path="M450,20 C 550,80 650,40 700,120 S 500,200 300,180" dur="20s" repeatCount="indefinite" begin="-7s"/>
      <animate attributeName="opacity" values="0;0.8;0.8;0" keyTimes="0;0.1;0.85;1" dur="20s" repeatCount="indefinite" begin="-7s"/>
    </circle>

    <!-- name -->
    <text x="450" y="98" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',monospace" font-size="42" font-weight="700" fill="#E5E7EB">
      Hey, I&#8217;m Luna
      <animate attributeName="opacity" values="0;1" dur="1.1s" fill="freeze"/>
    </text>
    <text x="450" y="98" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',monospace" font-size="42" font-weight="700" fill="none" stroke="#7C3AED" stroke-opacity="0.5">
      Hey, I&#8217;m Luna
    </text>

    <!-- cycling taglines -->
    <text x="450" y="140" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',monospace" font-size="18" fill="#A78BFA">
      full-stack dev + systems programmer
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.31;0.33;1" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="450" y="140" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',monospace" font-size="18" fill="#06B6D4">
      building MahinaOS from the kernel up
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.35;0.64;0.66;1" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="450" y="140" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',monospace" font-size="18" fill="#E5E7EB">
      shipping multi-agent AI platforms
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.66;0.68;0.97;1" dur="9s" repeatCount="indefinite"/>
    </text>

    <!-- status line -->
    <text x="450" y="178" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',monospace" font-size="12" fill="#6B7280" letter-spacing="2">
      DOCUMENTATION-FIRST · DARK MODE ONLY · STILL SHIPPING
    </text>

    <!-- scanning light sweep -->
    <rect x="0" y="212" width="900" height="2" fill="url(#scanGrad)">
      <animate attributeName="x" values="-900;900" dur="4.5s" repeatCount="indefinite"/>
    </rect>

    <!-- border -->
    <rect x="1" y="1" width="898" height="228" rx="18" fill="none" stroke="#7C3AED" stroke-opacity="0.35"/>
  </g>
</svg>
