<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="clip">
      <rect width="900" height="300" rx="12"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <!-- deep navy background -->
    <rect width="900" height="300" fill="#0B1020"/>

    <!-- outer frame -->
    <rect x="3" y="3" width="894" height="294" rx="10" fill="none" stroke="#E84545" stroke-width="2.5"/>
    <!-- inner frame -->
    <rect x="9" y="9" width="882" height="282" rx="7" fill="none" stroke="#E84545" stroke-opacity="0.3" stroke-width="1"/>

    <!-- ═══ TOP BANNER BAR ═══ -->
    <rect x="9" y="9" width="882" height="34" rx="7" fill="#E84545"/>
    <rect x="9" y="29" width="882" height="14" fill="#E84545"/>

    <text x="28" y="31" font-family="'Courier New','Lucida Console',monospace" font-size="13" font-weight="700" fill="#0B1020" letter-spacing="3">HELLO WORLD</text>

    <!-- pixel cloud (cyan) -->
    <g transform="translate(770,14)" fill="#06B6D4" opacity="0.85">
      <rect x="4" y="0" width="4" height="4"/><rect x="8" y="0" width="4" height="4"/>
      <rect x="12" y="0" width="4" height="4"/>
      <rect x="0" y="4" width="4" height="4"/><rect x="4" y="4" width="4" height="4"/>
      <rect x="8" y="4" width="4" height="4"/><rect x="12" y="4" width="4" height="4"/>
      <rect x="16" y="4" width="4" height="4"/>
    </g>

    <!-- pixel sparkle (gold) -->
    <g transform="translate(845,16)" fill="#FCD34D">
      <rect x="4" y="0" width="4" height="4"/>
      <rect x="0" y="4" width="4" height="4"/><rect x="4" y="4" width="4" height="4"/><rect x="8" y="4" width="4" height="4"/>
      <rect x="4" y="8" width="4" height="4"/>
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </g>

    <!-- ═══ MAIN NAME — serif font + CONTINUOUS GLITCH ═══ -->

    <!-- glitch layer: CYAN — always visible, jittering left -->
    <g opacity="0.45">
      <text x="430" y="108" text-anchor="middle"
            font-family="'Georgia','Palatino Linotype','Times New Roman',serif"
            font-size="38" font-weight="700" fill="#06B6D4" letter-spacing="8">
        HARDIK BHASKAR
      </text>
      <animateTransform attributeName="transform" type="translate"
        values="3,0; -2,1; 4,0; -1,-1; 2,0; -3,1; 1,0; 3,-1; -2,0; 0,0"
        dur="0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.6;0.3;0.5;0.2;0.55;0.4;0.45" dur="0.6s" repeatCount="indefinite"/>
    </g>

    <!-- glitch layer: RED — always visible, jittering right -->
    <g opacity="0.4">
      <text x="430" y="108" text-anchor="middle"
            font-family="'Georgia','Palatino Linotype','Times New Roman',serif"
            font-size="38" font-weight="700" fill="#E84545" letter-spacing="8">
        HARDIK BHASKAR
      </text>
      <animateTransform attributeName="transform" type="translate"
        values="-3,0; 2,-1; -4,0; 1,1; -2,0; 3,-1; -1,0; -3,1; 2,0; 0,0"
        dur="0.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.25;0.5;0.35;0.55;0.3;0.45;0.4" dur="0.5s" repeatCount="indefinite"/>
    </g>

    <!-- main text (solid, on top) -->
    <text x="430" y="108" text-anchor="middle"
          font-family="'Georgia','Palatino Linotype','Times New Roman',serif"
          font-size="38" font-weight="700" fill="#E5E7EB" letter-spacing="8">
      HARDIK BHASKAR
    </text>

    <!-- tiny alias -->
    <text x="745" y="108" text-anchor="start"
          font-family="'Courier New','Lucida Console',monospace"
          font-size="9" fill="#6B7280" font-style="italic">
      aka luna kitsune
    </text>

    <!-- red underline accent -->
    <line x1="280" y1="118" x2="580" y2="118" stroke="#E84545" stroke-width="2" stroke-opacity="0.6"/>

    <!-- ═══ TAGLINE — monospace italic ═══ -->
    <text x="450" y="148" text-anchor="middle"
          font-family="'Courier New','Lucida Console',monospace"
          font-size="14" font-style="italic" fill="#9CA3AF">
      full-stack dev · systems programmer · AI builder
    </text>

    <!-- ═══ THREE INFO CARDS ═══ -->
    <!-- Card 1: FOCUS -->
    <rect x="55" y="172" width="245" height="54" rx="5" fill="none" stroke="#E84545" stroke-width="1.5"/>
    <rect x="55" y="172" width="245" height="54" rx="5" fill="#E84545" fill-opacity="0.06"/>
    <text x="177" y="193" text-anchor="middle"
          font-family="'Trebuchet MS','Segoe UI','Verdana',sans-serif"
          font-size="11" font-weight="700" fill="#E84545" letter-spacing="2.5">FOCUS</text>
    <text x="177" y="212" text-anchor="middle"
          font-family="'Courier New',monospace"
          font-size="11" fill="#E5E7EB" letter-spacing="1.5">AI AGENTS · SYSTEMS · WEB</text>

    <!-- Card 2: MODE -->
    <rect x="327" y="172" width="245" height="54" rx="5" fill="none" stroke="#FF6B35" stroke-width="1.5"/>
    <rect x="327" y="172" width="245" height="54" rx="5" fill="#FF6B35" fill-opacity="0.06"/>
    <text x="450" y="193" text-anchor="middle"
          font-family="'Trebuchet MS','Segoe UI','Verdana',sans-serif"
          font-size="11" font-weight="700" fill="#FF6B35" letter-spacing="2.5">MODE</text>
    <text x="450" y="212" text-anchor="middle"
          font-family="'Courier New',monospace"
          font-size="11" fill="#E5E7EB" letter-spacing="1.5">DARK ONLY</text>

    <!-- Card 3: PHILOSOPHY -->
    <rect x="600" y="172" width="245" height="54" rx="5" fill="none" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="600" y="172" width="245" height="54" rx="5" fill="#FCD34D" fill-opacity="0.06"/>
    <text x="722" y="193" text-anchor="middle"
          font-family="'Trebuchet MS','Segoe UI','Verdana',sans-serif"
          font-size="11" font-weight="700" fill="#FCD34D" letter-spacing="2.5">PHILOSOPHY</text>
    <text x="722" y="212" text-anchor="middle"
          font-family="'Courier New',monospace"
          font-size="11" fill="#E5E7EB" letter-spacing="1.5">DOCS BEFORE CODE</text>

    <!-- ═══ BOTTOM PIXEL DECORATION ROW ═══ -->
    <!-- Pixel flowers (red petals + green stem) and gold stars, repeating -->

    <!-- flower 1 -->
    <g transform="translate(80,248)">
      <rect x="4" y="12" width="4" height="8" fill="#34D399"/>
      <rect x="0" y="4" width="4" height="4" fill="#E84545"/><rect x="4" y="0" width="4" height="4" fill="#E84545"/>
      <rect x="8" y="4" width="4" height="4" fill="#E84545"/><rect x="4" y="4" width="4" height="4" fill="#FF6B35"/>
    </g>
    <!-- star 1 -->
    <g transform="translate(140,252)" fill="#FCD34D">
      <rect x="4" y="0" width="4" height="4"/><rect x="0" y="4" width="4" height="4"/>
      <rect x="4" y="4" width="4" height="4"/><rect x="8" y="4" width="4" height="4"/>
      <rect x="4" y="8" width="4" height="4"/>
    </g>
    <!-- flower 2 -->
    <g transform="translate(200,248)">
      <rect x="4" y="12" width="4" height="8" fill="#34D399"/>
      <rect x="0" y="4" width="4" height="4" fill="#FF6B35"/><rect x="4" y="0" width="4" height="4" fill="#FF6B35"/>
      <rect x="8" y="4" width="4" height="4" fill="#FF6B35"/><rect x="4" y="4" width="4" height="4" fill="#FCD34D"/>
    </g>
    <!-- star 2 -->
    <g transform="translate(260,252)" fill="#E84545">
      <rect x="4" y="0" width="4" height="4"/><rect x="0" y="4" width="4" height="4"/>
      <rect x="4" y="4" width="4" height="4"/><rect x="8" y="4" width="4" height="4"/>
      <rect x="4" y="8" width="4" height="4"/>
    </g>
    <!-- flower 3 -->
    <g transform="translate(320,248)">
      <rect x="4" y="12" width="4" height="8" fill="#34D399"/>
      <rect x="0" y="4" width="4" height="4" fill="#E84545"/><rect x="4" y="0" width="4" height="4" fill="#E84545"/>
      <rect x="8" y="4" width="4" height="4" fill="#E84545"/><rect x="4" y="4" width="4" height="4" fill="#FF6B35"/>
    </g>
    <!-- star 3 -->
    <g transform="translate(380,252)" fill="#FCD34D">
      <rect x="4" y="0" width="4" height="4"/><rect x="0" y="4" width="4" height="4"/>
      <rect x="4" y="4" width="4" height="4"/><rect x="8" y="4" width="4" height="4"/>
      <rect x="4" y="8" width="4" height="4"/>
    </g>
    <!-- flower 4 -->
    <g transform="translate(440,248)">
      <rect x="4" y="12" width="4" height="8" fill="#34D399"/>
      <rect x="0" y="4" width="4" height="4" fill="#FF6B35"/><rect x="4" y="0" width="4" height="4" fill="#FF6B35"/>
      <rect x="8" y="4" width="4" height="4" fill="#FF6B35"/><rect x="4" y="4" width="4" height="4" fill="#FCD34D"/>
    </g>
    <!-- star 4 -->
    <g transform="translate(500,252)" fill="#E84545">
      <rect x="4" y="0" width="4" height="4"/><rect x="0" y="4" width="4" height="4"/>
      <rect x="4" y="4" width="4" height="4"/><rect x="8" y="4" width="4" height="4"/>
      <rect x="4" y="8" width="4" height="4"/>
    </g>
    <!-- flower 5 -->
    <g transform="translate(560,248)">
      <rect x="4" y="12" width="4" height="8" fill="#34D399"/>
      <rect x="0" y="4" width="4" height="4" fill="#E84545"/><rect x="4" y="0" width="4" height="4" fill="#E84545"/>
      <rect x="8" y="4" width="4" height="4" fill="#E84545"/><rect x="4" y="4" width="4" height="4" fill="#FF6B35"/>
    </g>
    <!-- star 5 -->
    <g transform="translate(620,252)" fill="#FCD34D">
      <rect x="4" y="0" width="4" height="4"/><rect x="0" y="4" width="4" height="4"/>
      <rect x="4" y="4" width="4" height="4"/><rect x="8" y="4" width="4" height="4"/>
      <rect x="4" y="8" width="4" height="4"/>
    </g>
    <!-- flower 6 -->
    <g transform="translate(680,248)">
      <rect x="4" y="12" width="4" height="8" fill="#34D399"/>
      <rect x="0" y="4" width="4" height="4" fill="#FF6B35"/><rect x="4" y="0" width="4" height="4" fill="#FF6B35"/>
      <rect x="8" y="4" width="4" height="4" fill="#FF6B35"/><rect x="4" y="4" width="4" height="4" fill="#FCD34D"/>
    </g>
    <!-- star 6 -->
    <g transform="translate(740,252)" fill="#E84545">
      <rect x="4" y="0" width="4" height="4"/><rect x="0" y="4" width="4" height="4"/>
      <rect x="4" y="4" width="4" height="4"/><rect x="8" y="4" width="4" height="4"/>
      <rect x="4" y="8" width="4" height="4"/>
    </g>
    <!-- flower 7 -->
    <g transform="translate(800,248)">
      <rect x="4" y="12" width="4" height="8" fill="#34D399"/>
      <rect x="0" y="4" width="4" height="4" fill="#E84545"/><rect x="4" y="0" width="4" height="4" fill="#E84545"/>
      <rect x="8" y="4" width="4" height="4" fill="#E84545"/><rect x="4" y="4" width="4" height="4" fill="#FF6B35"/>
    </g>
  </g>
</svg>
