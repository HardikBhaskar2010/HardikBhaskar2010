name: Update Language Chart

on:
  schedule:
    - cron: "0 3 * * 0"   # weekly, Sunday 03:00 UTC — languages don't shift daily
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  update-chart:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate assets/lang-chart.svg from real GitHub data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_lang_chart.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/lang-chart.svg
          git diff --staged --quiet || git commit -m "chore: refresh language chart [skip ci]"
          git push
